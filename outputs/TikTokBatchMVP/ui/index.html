<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TikTok 下载器</title>
  <style>
    :root{--bg:#0b0e14;--panel:#141925;--panel2:#191f2d;--line:#293144;--text:#f5f7ff;--muted:#8491a8;--red:#ff4f61;--green:#39df9d;--blue:#55a6ff}
    *{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:"Microsoft YaHei UI","Segoe UI",sans-serif;font-size:13px;overflow:hidden}
    button,input,select{font:inherit}.app{height:100%;display:grid;grid-template-rows:58px 1fr 62px}.top{display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
    .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#ff4066,#ff725d);display:grid;place-items:center;font-size:18px;box-shadow:0 8px 25px #ff4f6130}.brand{min-width:154px}.brand b{display:block;font-size:15px}.brand small{color:var(--green);font-size:10px}.url{height:36px;flex:1;border:1px solid var(--line);border-radius:10px;background:#0f1420;color:var(--text);padding:0 13px;outline:0}.url:focus{border-color:#52617e;box-shadow:0 0 0 3px #53638322}
    .btn{height:34px;border:1px solid var(--line);border-radius:9px;background:#182031;color:var(--text);padding:0 14px;cursor:pointer}.btn:hover{background:#232d42}.btn.primary{background:var(--red);border-color:var(--red);font-weight:700;box-shadow:0 8px 22px #ff4f6128}.btn.primary:hover{background:#ff6675}.btn:disabled{opacity:.45;cursor:not-allowed}.badge{padding:8px 12px;border:1px solid var(--line);border-radius:9px;font-weight:700}.badge i{font-style:normal;background:var(--red);border-radius:20px;padding:1px 6px;margin-left:5px;font-size:11px}
    .body{display:grid;grid-template-columns:minmax(640px,1fr) 400px;min-height:0}.main{min-width:0;min-height:0;display:flex;flex-direction:column}.queue-panel{border-left:1px solid var(--line);background:var(--panel);padding:14px;min-width:0}.profile{display:none;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#24f3d0,#ff3f71);font-weight:900;font-size:18px;overflow:hidden;flex:0 0 42px}.avatar img{width:100%;height:100%;object-fit:cover}.profile-name{font-size:17px;font-weight:800}.profile-meta{color:var(--muted);margin-top:4px}.back-home{margin-left:auto;flex:0 0 auto}.tabs{display:none;gap:26px;padding:0 18px;height:48px;align-items:end;border-bottom:1px solid var(--line)}.tab{height:48px;padding:0 6px;display:flex;align-items:center;color:var(--muted);border-bottom:2px solid transparent}.tab.active{color:var(--text);border-color:var(--red);font-weight:700}.tab span{margin-left:7px;color:var(--muted);font-size:11px}.kind{display:inline-block;margin-left:7px;padding:1px 6px;border-radius:5px;background:#245c49;color:#83f0bd;font-size:10px}
    .toolbar{display:none;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line)}.pager{margin-left:auto;display:flex;align-items:center;gap:6px;white-space:nowrap}.pager .mini{padding:0 10px}.page-info{min-width:62px;text-align:center;color:var(--muted);font-size:12px}.search{width:230px;height:32px;border:1px solid var(--line);border-radius:8px;background:#111722;color:var(--text);padding:0 11px;outline:none}.selection{margin-left:8px;color:var(--blue);font-weight:700;white-space:nowrap}.empty{flex:1;display:grid;place-items:center}.empty-inner{text-align:center;margin-top:-60px}.tv{font-size:48px;filter:drop-shadow(0 10px 20px #000)}.empty h2{font-size:20px;margin:13px 0 8px}.empty p{color:var(--muted);font-size:14px}.examples{display:flex;gap:12px;justify-content:center;margin-top:26px}.recent-wrap{width:min(720px,80vw);margin:38px auto 0;text-align:left}.recent-title{color:var(--muted);padding-bottom:9px;border-bottom:1px solid var(--line)}.recent-grid{display:flex;flex-wrap:wrap;gap:20px;margin-top:16px}.recent-card{width:84px;text-align:center;color:var(--text);cursor:pointer}.recent-card:hover{color:#78b9ff}.recent-avatar{width:58px;height:58px;margin:0 auto 8px;border-radius:50%;object-fit:cover;border:2px solid #35415a;background:#20283a}.recent-id{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.chip{border:1px solid var(--line);border-radius:8px;background:#131927;color:#a9b6cb;padding:7px 10px}
    .list{display:none;flex:1 1 0;height:0;overflow-y:scroll;overflow-x:hidden;min-height:0;padding:6px 10px 18px;scrollbar-color:#46516a #111722;scrollbar-width:thin}.row{display:grid;grid-template-columns:28px 58px minmax(0,1fr) 160px 64px;align-items:center;gap:9px;min-height:68px;padding:7px 8px;border-radius:10px;border:1px solid transparent}.row:hover{background:var(--panel2);border-color:#222a3b}.check{width:16px;height:16px;accent-color:var(--red)}.thumb{height:48px;border-radius:7px;background:linear-gradient(135deg,#293552,#111722);display:grid;place-items:center;color:#b7c2d8;font-size:19px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.sub{color:var(--muted);font-size:11px;margin-top:6px}.heart{color:#ff7180}.id{color:var(--muted);font-family:Consolas,monospace;font-size:11px}.mini{height:30px;padding:0 11px}.queue-head{display:flex;align-items:center;gap:8px;white-space:nowrap}.queue-head b{font-size:15px;flex:0 0 auto}.queue-controls{display:flex;gap:5px;min-width:0}.queue-controls .mini{height:28px;padding:0 8px;font-size:12px}.queue-controls .danger{color:#ffd7dc;border-color:#713744;background:#4a2630}.stats{display:flex;justify-content:space-between;gap:5px;white-space:nowrap;color:var(--muted);font-size:11px;margin:12px 0}.stats strong{color:var(--text);margin-left:2px}.queue{height:calc(100% - 58px);overflow:auto}.q-empty{color:var(--muted);text-align:center;margin-top:90px}.q-card{display:grid;grid-template-columns:48px minmax(0,1fr);gap:9px;padding:9px;margin-bottom:9px;border:1px solid var(--line);border-radius:11px;background:#18202e}.q-cover{width:48px;height:48px;border-radius:7px;object-fit:cover;background:#273044}.q-card.done{border-color:#1d684d}.q-card.failed{border-color:#743543}.q-top{display:flex;align-items:center;gap:7px}.q-title{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}.q-actions{display:flex;gap:5px}.q-btn{height:28px;border:1px solid var(--line);border-radius:7px;background:#222a3b;color:var(--text);padding:0 9px;cursor:pointer}.q-btn:hover{background:#303b52}.q-btn.close{width:29px;padding:0;font-size:17px}.q-meta{color:var(--muted);font-size:11px;margin-top:7px}.bar{height:3px;background:#273044;border-radius:3px;margin-top:7px;overflow:hidden}.bar i{display:block;width:0;height:100%;background:var(--green);transition:.25s}.q-card.loading .bar i{width:0}.q-card.done .bar i{width:100%}.q-card.failed .bar i{width:100%;background:var(--red)}
    .preview{cursor:pointer}.preview:hover{outline:2px solid #55a6ff88}.modal{position:fixed;inset:0;z-index:50;background:#05070bd9;display:grid;place-items:center;padding:24px}.modal-card{width:min(520px,92vw);max-height:92vh;display:flex;flex-direction:column;background:#121722;border:1px solid #34405a;border-radius:14px;box-shadow:0 24px 80px #000;overflow:hidden}.modal-head{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}.modal-title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px;font-weight:800}.modal-close{width:34px;padding:0;font-size:20px}.preview-stage{display:flex;justify-content:center;align-items:center;min-height:260px;max-height:62vh;background:#080a0f;overflow:hidden}.preview-stage img{display:block;max-width:100%;max-height:62vh;width:auto;height:auto;object-fit:contain}.modal-info{padding:14px 16px;border-top:1px solid var(--line);overflow:auto}.preview-stats{color:#aab6ca;margin-bottom:9px}.preview-desc{max-height:120px;overflow:auto;white-space:pre-wrap;line-height:1.55}
    .bottom{display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--panel);border-top:1px solid var(--line)}.bottom label{color:var(--muted)}select,.folder{height:36px;border:1px solid var(--line);border-radius:9px;background:#111722;color:var(--text);padding:0 11px}.folder{flex:1;min-width:250px}.status{color:var(--muted);max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.start{height:40px;min-width:112px}.hidden{display:none!important}
  </style>
</head>
<body><div class="app">
  <header class="top"><div class="logo">♪</div><div class="brand"><b>TikTok 下载器</b><small>批量下载 · 无水印源优先</small></div><input id="url" class="url" value="https://www.tiktok.com/@" placeholder="粘贴博主主页链接，例如 https://www.tiktok.com/@username"><button id="recognize" class="btn primary">识别</button><div class="badge">队列 <i id="badge">0</i></div><button class="btn" id="settings">⚙ 设置</button></header>
  <section class="body"><main class="main">
    <div id="profile" class="profile"><div id="profileAvatar" class="avatar">♪</div><div><div id="profileName" class="profile-name">@username</div><div id="profileMeta" class="profile-meta"></div></div><button id="backHome" class="btn back-home">← 返回</button></div>
    <div id="tabs" class="tabs"><div class="tab active" data-filter="all">全部 <span id="allCount">0</span></div><div class="tab" data-filter="video">Videos <span id="videoCount">0</span></div><div class="tab" data-filter="image">Images <span id="imageCount">0</span></div></div>
    <div id="toolbar" class="toolbar"><input id="search" class="search" placeholder="按标题或视频 ID 筛选…"><select id="sort"><option value="default">主页顺序</option><option value="likes">点赞最多</option><option value="views">播放最多</option><option value="date">最新上传</option></select><button class="btn mini" id="selectAll">全选</button><button class="btn mini" id="clearAll">清空</button><button class="btn mini" id="invert">反选</button><div class="pager"><button class="btn mini" id="prevPage">上一页</button><span id="pageInfo" class="page-info">1 / 1</span><button class="btn mini" id="nextPage">下一页</button></div><div id="selection" class="selection">已选 0 / 0</div></div>
    <div id="empty" class="empty"><div class="empty-inner"><div class="tv">📺</div><h2>粘贴博主主页链接开始</h2><p>自动读取主页全部公开视频，勾选后批量下载</p><div class="examples"><span class="chip">@username</span><span class="chip">tiktok.com/@username</span><span class="chip">单个视频链接</span></div><div class="recent-wrap"><div class="recent-title">最近抓取的博主</div><div id="recentProfiles" class="recent-grid"></div></div></div></div>
    <div id="list" class="list"></div>
  </main><aside class="queue-panel"><div class="queue-head"><b>下载队列</b><div class="queue-controls"><button id="pauseAll" class="btn mini">全部暂停</button> <button id="resumeAll" class="btn mini">全部继续</button> <button id="cancelAll" class="btn mini danger">全部取消</button> <button id="clearDone" class="btn mini">清除已完成</button></div></div><div class="stats"><span>进行中 <strong id="active">0</strong></span><span>等待 <strong id="waiting">0</strong></span><span>暂停 <strong id="paused">0</strong></span><span>完成 <strong id="done">0</strong></span><span>失败 <strong id="failed">0</strong></span><span>并发 <strong>1</strong></span></div><div id="queue" class="queue"><div class="q-empty">勾选视频后将显示在这里</div></div></aside></section>
  <footer class="bottom"><label>画质</label><select id="quality"><option>最佳画质</option><option>720p</option><option>540p</option></select><label>保存到</label><input id="folder" class="folder" value=""><button id="browse" class="btn">浏览</button><span id="status" class="status">就绪</span><button id="start" class="btn primary start" disabled>开始下载</button></footer>
</div><div id="previewModal" class="modal hidden"><div class="modal-card"><div class="modal-head"><div id="previewTitle" class="modal-title"></div><button id="previewClose" class="btn modal-close">×</button></div><div id="previewStage" class="preview-stage"></div><div class="modal-info"><div id="previewStats" class="preview-stats"></div><div id="previewDesc" class="preview-desc"></div></div></div></div><script>
  let videos=[], selected=new Set(), states={}, folders={}, errors={}, currentPage=1, activeFilter="all", currentUsername="";const pageSize=15;let records={};try{records=JSON.parse(localStorage.getItem('tiktok-download-records')||'{}')}catch(e){records={}}
  const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function setStatus(text){$('status').textContent=text}
  function num(v){if(v===null||v===undefined||v==='')return null;if(typeof v==='string'&&/[KMB]/i.test(v))return v;const n=Number(v);if(!Number.isFinite(n))return v;if(n>=100000000)return (n/100000000).toFixed(1)+'亿';if(n>=10000)return (n/10000).toFixed(1)+'万';return n.toLocaleString()}
  function date(v){return v&&v.length===8?`${v.slice(0,4)}-${v.slice(4,6)}-${v.slice(6,8)}`:'时间读取中'}
  function visibleVideos(){const q=$('search').value.trim().toLowerCase();let rows=videos.filter(v=>(activeFilter==='all'||(v.type||'video')===activeFilter)&&(!q||(v.title+' '+v.id).toLowerCase().includes(q))).slice();const s=$('sort').value;if(s==='likes')rows.sort((a,b)=>(Number(b.likes)||-1)-(Number(a.likes)||-1));if(s==='views')rows.sort((a,b)=>(Number(b.views)||-1)-(Number(a.views)||-1));if(s==='date')rows.sort((a,b)=>String(b.upload_date||'').localeCompare(String(a.upload_date||'')));return rows}
  function renderList(){const all=visibleVideos(),pages=Math.max(1,Math.ceil(all.length/pageSize));currentPage=Math.min(Math.max(1,currentPage),pages);const rows=all.slice((currentPage-1)*pageSize,currentPage*pageSize);$('pageInfo').textContent=`${currentPage} / ${pages}`;$('prevPage').disabled=currentPage<=1;$('nextPage').disabled=currentPage>=pages;$('list').innerHTML=rows.map(v=>`<div class="row"><input class="check" type="checkbox" data-id="${v.id}" ${selected.has(v.id)?'checked':''}><div class="thumb preview" data-id="${v.id}">${v.cover?`<img src="${esc(v.cover)}" loading="lazy" onerror="this.parentNode.textContent='▶'">`:'▶'}</div><div><div class="title" title="${esc(v.title)}">${esc(v.title)}${v.type==='image'?'<span class="kind">Images</span>':''}</div><div class="sub">${date(v.upload_date)} · ▶ ${num(v.views)||'读取中'} · <span class="heart">♥ ${num(v.likes)||'读取中'}</span>${v.comments!=null?' · 💬 '+num(v.comments):''}</div></div><div class="id">${v.id}</div><button class="btn mini one" data-id="${v.id}">下载</button></div>`).join('');document.querySelectorAll('.check').forEach(x=>x.onchange=()=>toggle(x.dataset.id,x.checked));document.querySelectorAll('.one').forEach(x=>x.onclick=()=>{selected=new Set([x.dataset.id]);sync();startDownload()});document.querySelectorAll('.preview').forEach(x=>x.onclick=()=>openPreview(x.dataset.id))}
  function toggle(id,on){on?selected.add(id):selected.delete(id);sync(false)}
  function sync(render=true){if(render)renderList();$('selection').textContent=`已选 ${selected.size} / ${videos.length}`;$('badge').textContent=selected.size;$('waiting').textContent=[...selected].filter(id=>!states[id]).length;$('active').textContent=Object.values(states).filter(x=>x==='downloading').length;$('paused').textContent=Object.values(states).filter(x=>x==='paused').length;$('done').textContent=Object.values(states).filter(x=>x==='done'||x==='skipped').length;$('failed').textContent=Object.values(states).filter(x=>x==='failed').length;$('start').disabled=!selected.size;renderQueue()}
  function persistRecord(id){if(!currentUsername)return;const v=videos.find(x=>x.id===id);if(!v)return;if(!records[currentUsername])records[currentUsername]={};records[currentUsername][id]={item:v,state:states[id]||'',folder:folders[id]||'',error:errors[id]||''};localStorage.setItem('tiktok-download-records',JSON.stringify(records))}
  function renderQueue(){const chosen=videos.filter(v=>selected.has(v.id));if(!chosen.length){$('queue').innerHTML='<div class="q-empty">勾选视频后将显示在这里</div>';return}$('queue').innerHTML=chosen.map(v=>{const s=states[v.id]||'';const actions=(s==='done'||s==='skipped')?`<div class="q-actions"><button class="q-btn q-open" data-id="${v.id}">打开</button><button class="q-btn close q-remove" data-id="${v.id}" title="删除记录，不删除视频">×</button></div>`:s==='failed'?`<div class="q-actions"><button class="q-btn q-retry" data-id="${v.id}">重试</button><button class="q-btn close q-remove" data-id="${v.id}">×</button></div>`:'';return `<div id="q-${v.id}" class="q-card ${s==='downloading'?'loading':s}">${v.cover?`<img class="q-cover" src="${esc(v.cover)}">`:'<div class="q-cover"></div>'}<div><div class="q-top"><div class="q-title">${esc(v.title)}</div>${actions}</div><div class="q-meta" id="qm-${v.id}">${s==='done'?'已完成':s==='skipped'?'已存在，跳过':s==='failed'?'下载失败':s==='downloading'?'正在下载…':'等待下载'} · ♥ ${num(v.likes)||'--'}</div><div class="bar"><i id="qb-${v.id}"></i></div></div></div>`}).join('');document.querySelectorAll('.q-open').forEach(x=>x.onclick=()=>openFolder(x.dataset.id));document.querySelectorAll('.q-remove').forEach(x=>x.onclick=()=>removeRecord(x.dataset.id));document.querySelectorAll('.q-retry').forEach(x=>x.onclick=()=>{delete errors[x.dataset.id];states[x.dataset.id]='';selected.add(x.dataset.id);sync();startDownload([x.dataset.id])})}
  function downloadProgress(data){
    if(data.state==='progress'){
      const bar=$('qb-'+data.id),meta=$('qm-'+data.id),pct=Math.max(0,Math.min(100,Number(data.percent)||0));
      if(bar)bar.style.width=pct+'%';
      if(meta)meta.textContent=`正在下载… ${pct}%`;
      setStatus(`正在下载：${pct}%`);
      return;
    }
    states[data.id]=data.state;if(data.folder)folders[data.id]=data.folder;if(data.error)errors[data.id]=data.error;persistRecord(data.id);renderQueue();syncStats();if(data.total)setStatus(`下载 ${data.index}/${data.total}`)
  }
  function syncStats(){$('waiting').textContent=[...selected].filter(id=>!states[id]).length;$('active').textContent=Object.values(states).filter(x=>x==='downloading').length;$('paused').textContent=Object.values(states).filter(x=>x==='paused').length;$('done').textContent=Object.values(states).filter(x=>x==='done'||x==='skipped').length;$('failed').textContent=Object.values(states).filter(x=>x==='failed').length}

  async function openFolder(id){const path=folders[id];if(!path)return;const r=await window.pywebview.api.open_folder(path);if(!r.ok)alert(r.error)}
  function removeRecord(id){selected.delete(id);delete states[id];delete folders[id];delete errors[id];if(records[currentUsername]){delete records[currentUsername][id];localStorage.setItem('tiktok-download-records',JSON.stringify(records))}sync()}
  let previewToken=0;
  function openPreview(id){const v=videos.find(x=>x.id===id);if(!v)return;previewToken++;$('previewTitle').textContent=v.type==='image'?'图片作品详情':'视频详情';$('previewDesc').textContent=v.title;$('previewStats').textContent=`发布时间 ${date(v.upload_date)}　 ▶ ${num(v.views)||'--'}　 ♥ ${num(v.likes)||'--'}`;const stage=$('previewStage');stage.innerHTML='';if(v.cover){const img=document.createElement('img');img.src=v.cover;img.alt=v.title;stage.appendChild(img)}else{stage.textContent='暂无封面'}$('previewModal').classList.remove('hidden')}
  function closePreview(){previewToken++;$('previewModal').classList.add('hidden')}
  async function loadRecentProfiles(){const rows=await window.pywebview.api.recent_profiles();$('recentProfiles').innerHTML=rows.length?rows.map(p=>`<div class="recent-card" data-user="${esc(p.username)}"><img class="recent-avatar" src="${esc(p.avatar)}"><div class="recent-id">@${esc(p.username)}</div></div>`).join(''):'<span class="profile-meta">暂无抓取记录</span>';document.querySelectorAll('.recent-card').forEach(x=>x.onclick=()=>{$('url').value='https://www.tiktok.com/@'+x.dataset.user;recognize()})}
  function showHome(){$('profile').style.display='none';$('tabs').style.display='none';$('toolbar').style.display='none';$('list').style.display='none';$('empty').classList.remove('hidden');$('url').value='https://www.tiktok.com/@';setStatus('就绪');loadRecentProfiles()}
  function profileUpdate(data){const ps=data.profileStats||{};$('profileName').textContent='@'+data.username;$('profileAvatar').innerHTML=data.avatar?`<img src="${esc(data.avatar)}" onerror="this.parentNode.textContent='♪'">`:'♪';$('profileMeta').textContent=`Following ${num(ps.following)??'--'}　 Followers ${num(ps.followers)??'--'}　 Likes ${num(ps.likes)??'--'}`;$('profile').style.display='flex'}
  function metadataUpdate(data){const i=videos.findIndex(v=>v.id===data.id);if(i>=0)videos[i]={...videos[i],...data};renderList();renderQueue()}
  function metadataStatus(data){setStatus(`列表可用 · 后台读取数据 ${data.current}/${data.total}`)}
  async function recognize(){const b=$('recognize');b.disabled=true;b.textContent='识别中…';const m=$('url').value.match(/@([^/?]+)/);if(m)profileUpdate({username:m[1],avatar:'',profileStats:{}});setStatus('优先读取博主数据…');const r=await window.pywebview.api.recognize($('url').value);b.disabled=false;b.textContent='重新抓取';if(!r.ok){setStatus('读取失败');alert(r.error);return}videos=r.videos;selected=new Set();currentPage=1;states={};folders={};errors={};currentUsername=r.username;const saved=records[currentUsername]||{};Object.values(saved).forEach(rec=>{if(rec.item&&!videos.some(v=>v.id===rec.item.id))videos.push(rec.item);if(rec.item){selected.add(rec.item.id);states[rec.item.id]=rec.state||'done';folders[rec.item.id]=rec.folder||'';errors[rec.item.id]=rec.error||''}});profileUpdate({username:r.username,avatar:r.avatar,profileStats:r.profileStats});$('allCount').textContent=videos.length;$('videoCount').textContent=videos.filter(v=>(v.type||'video')==='video').length;$('imageCount').textContent=videos.filter(v=>v.type==='image').length;activeFilter='all';document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.filter==='all'));$('empty').classList.add('hidden');$('profile').style.display='flex';$('tabs').style.display='flex';$('toolbar').style.display='flex';$('list').style.display='block';setStatus(`读取完成：${videos.length} 条`);sync();window.pywebview.api.enrich(videos)}
  async function startDownload(ids){const items=videos.filter(v=>ids?ids.includes(v.id):selected.has(v.id));if(!items.length)return;let folder=$('folder').value;if(!folder){folder=await window.pywebview.api.choose_folder();if(!folder)return;$('folder').value=folder}$('start').disabled=true;const r=await window.pywebview.api.download(items,folder,$('quality').value);setStatus(`完成：成功 ${r.ok}，失败 ${r.failed.length}`);$('start').disabled=false}
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{activeFilter=t.dataset.filter;currentPage=1;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));renderList()});$('recognize').onclick=recognize;$('selectAll').onclick=()=>{visibleVideos().forEach(v=>selected.add(v.id));sync()};$('clearAll').onclick=()=>{selected.clear();sync()};$('invert').onclick=()=>{visibleVideos().forEach(v=>selected.has(v.id)?selected.delete(v.id):selected.add(v.id));sync()};$('pauseAll').onclick=async()=>{await window.pywebview.api.pause_downloads();Object.keys(states).forEach(id=>{if(states[id]==='downloading')states[id]='paused'});sync()};$('resumeAll').onclick=async()=>{await window.pywebview.api.resume_downloads();Object.keys(states).forEach(id=>{if(states[id]==='paused')states[id]='downloading'});sync()};$('cancelAll').onclick=async()=>{await window.pywebview.api.cancel_downloads();selected.clear();states={};folders={};sync()};$('clearDone').onclick=()=>{Object.keys(states).filter(id=>states[id]==='done').forEach(id=>{selected.delete(id);delete states[id];delete folders[id]});sync()};$('prevPage').onclick=()=>{if(currentPage>1){currentPage--;renderList()}};$('nextPage').onclick=()=>{const pages=Math.max(1,Math.ceil(visibleVideos().length/pageSize));if(currentPage<pages){currentPage++;renderList()}};$('search').oninput=()=>{currentPage=1;renderList()};$('sort').onchange=()=>{currentPage=1;renderList()};$('browse').onclick=async()=>{const x=await window.pywebview.api.choose_folder();if(x)$('folder').value=x};$('start').onclick=startDownload;$('settings').onclick=()=>alert('MVP 设置：画质与保存目录位于底部。');
  $('backHome').onclick=showHome;$('previewClose').onclick=closePreview;$('previewModal').onclick=e=>{if(e.target===$('previewModal'))closePreview()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closePreview()});
  window.addEventListener('pywebviewready',()=>{setStatus('就绪');loadRecentProfiles()});
